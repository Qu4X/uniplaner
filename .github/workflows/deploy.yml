name: Deploy Uniplaner to GitHub Pages

on:
  # Run automatically once daily in the morning (~06:00 CEST / ~05:00 CET)
  schedule:
    - cron: '0 4 * * *'
  # Allow manual 1-click trigger from GitHub Actions tab
  workflow_dispatch:
  # Run on push to main
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Regression & Modular Tests (Python)
        run: |
          python tests/test_backend.py
          python -m unittest discover -s tests -p "test_*.py"

      - name: Run Frontend Engine Tests (Node.js)
        run: |
          npm test

      - name: Build Uniplaner Platform (Portal & Multi-Tenant PWAs)
        run: |
          python -m core.build --all

      - name: Verify Multi-PWA Output Structure
        run: |
          python -c "
          import os, sys
          required = [
              'dist/index.html',
              'dist/tenants.json',
              'dist/portal.css',
              'dist/portal.js',
              'dist/umg/wn/index.html',
              'dist/umg/wn/manifest.json',
              'dist/sggw/wmw/index.html',
              'dist/sggw/wmw/manifest.json'
          ]
          missing = [f for f in required if not os.path.exists(f)]
          if missing:
              print(f'Missing files in dist/: {missing}', file=sys.stderr)
              sys.exit(1)
          print('Verification of dist/ structure succeeded.')
          "

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
