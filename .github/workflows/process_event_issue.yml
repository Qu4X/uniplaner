name: Process Event Issue (GitOps)

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  approve_and_publish:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'event-proposal')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Parse issue and update data/events.json
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python scripts/add_event_from_issue.py

      - name: Run Backend Validation
        run: |
          python tests/test_backend.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tenants/umg_wn/events.json
          git commit -m "feat(events): add event from issue #${{ github.event.issue.number }}"
          git push

      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🎉 **Wydarzenie zostało pomyślnie dodane do bazy `tenants/umg_wn/events.json` i opublikowane w planie!**\n\nZmiany zostały wdrożone do gałęzi `main`. Strona na GitHub Pages zaktualizuje się automatycznie w ciągu około 1-2 minut.'
            });
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              state_reason: 'completed'
            });
