<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uniplaner — Wybierz swoją uczelnię i wydział</title>
  <meta name="description" content="Nowoczesna, modularna i otwarta platforma planu zajęć dla studentów polskich uczelni wyższych.">
  <meta name="theme-color" content="#0d233a">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/svg+xml" href="assets/uniplaner.svg">
  <link rel="alternate icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="portal.css">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var reg of regs) {
          if (!reg.scope.includes('/umg/') && !reg.scope.includes('/sggw/')) {
            reg.unregister().then(function() {
              if ('caches' in window) {
                caches.keys().then(function(keys) {
                  keys.forEach(function(k) {
                    if (k.startsWith('plan-app-')) caches.delete(k);
                  });
                });
              }
            });
          }
        }
      });
    }
  </script>
</head>
<body>
  <div class="portal-container">
    <header class="portal-header">
      <div class="logo-wrapper">
        <img
          src="assets/uniplaner.svg"
          alt="Uniplaner Logo"
          class="portal-logo"
          width="512"
          height="512"
          fetchpriority="high"
        >
      </div>
      <h1 class="portal-title">Uniplaner</h1>
      <p class="portal-subtitle">Nowoczesna, szybka platforma planu zajęć dla Twojej uczelni</p>
    </header>

    <main id="portal-app" class="portal-main">
      <!-- Sekcja ostatnio odwiedzanego wydziału (renderowana przez JS) -->
      <section id="last-visited-card" class="last-visited-card" aria-label="Ostatnio przeglądany plan" hidden>
        <div class="last-visited-content">
          <div class="last-visited-label">
            <span class="pulse-dot" aria-hidden="true"></span>
            Ostatnio przeglądany plan:
          </div>
          <div class="last-visited-title" id="last-visited-text">Ładowanie...</div>
        </div>
        <div class="last-visited-actions">
          <a id="last-visited-link" href="#" class="btn-fast-forward" title="Przejdź bezpośrednio do ostatnio wybranego planu">
            Otwórz plan &rarr;
          </a>
        </div>
      </section>

      <!-- Karta wyboru uczelni i wydziału -->
      <section class="portal-card" aria-labelledby="form-heading">
        <h2 id="form-heading" class="sr-only">Formularz wyboru uczelni i wydziału</h2>

        <div class="form-flow">
          <!-- Krok 1: Wyszukiwalny Dropdown (Combobox) Uczelni -->
          <div class="form-step" id="step-university">
            <label for="uni-search-input" id="uni-label" class="step-label">
              <span class="step-badge">1</span>
              <span>Wybierz lub wyszukaj uczelnię</span>
            </label>

            <div class="combobox-container">
              <div class="combobox-field">
                <span class="combobox-icon" aria-hidden="true">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  </svg>
                </span>
                <input
                  type="search"
                  id="uni-search-input"
                  class="combobox-input"
                  role="combobox"
                  aria-autocomplete="list"
                  aria-expanded="false"
                  aria-controls="uni-listbox"
                  aria-labelledby="uni-label"
                  placeholder="Wpisz nazwę uczelni lub skrót (np. UMG, SGGW)..."
                  autocomplete="off"
                  spellcheck="false"
                >
                <button
                  type="button"
                  id="uni-toggle-btn"
                  class="combobox-arrow-btn"
                  aria-label="Pokaż listę wszystkich uczelni"
                  aria-expanded="false"
                >
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </button>
              </div>

              <!-- Lista rozwijana z wynikami -->
              <ul
                id="uni-listbox"
                class="combobox-listbox"
                role="listbox"
                aria-label="Dostępne uczelnie"
                hidden
              ></ul>

              <!-- Live region dla czytników ekranowych -->
              <div id="uni-status" class="sr-only" role="status" aria-live="polite"></div>
            </div>
          </div>

          <!-- Krok 2: Wybór Wydziału (Adaptera) -->
          <div class="form-step" id="step-faculty" hidden>
            <label id="faculty-label" class="step-label">
              <span class="step-badge">2</span>
              <span>Wybierz wydział i adapter planu</span>
            </label>

            <div
              id="faculty-list"
              class="faculty-grid"
              role="radiogroup"
              aria-labelledby="faculty-label"
            ></div>
          </div>

          <!-- Krok 3: Przycisk przejścia do wybranego adaptera -->
          <div class="form-step form-step-action" id="step-action" hidden>
            <a
              id="launch-plan-btn"
              class="btn-launch"
              href="#"
              role="button"
            >
              <span>Przejdź do planu zajęć</span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </a>
          </div>
        </div>
      </section>
    </main>

    <footer class="portal-footer">
      <p>
        <strong>Uniplaner</strong> &mdash; Otwarty projekt studencki na licencji MIT.
      </p>
      <div class="footer-links">
        <a href="https://github.com/Qu4X/uniplaner" target="_blank" rel="noopener noreferrer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          <span>GitHub</span>
        </a>
      </div>
    </footer>
  </div>

  <script src="portal.js" defer></script>
</body>
</html>
